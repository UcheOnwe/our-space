services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-our_space}
      POSTGRES_USER: ${POSTGRES_USER:-our_space}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-our_space}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
