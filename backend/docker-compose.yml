services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-our_space}
      POSTGRES_USER: ${POSTGRES_USER:-our_space}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-our_space}
    ports:
      - "5433:5432"
  

    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-our_space}
      POSTGRES_USER: ${POSTGRES_USER:-our_space}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-our_space}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
  
    depends_on:
      - db
  
volumes:
  postgres_data:
